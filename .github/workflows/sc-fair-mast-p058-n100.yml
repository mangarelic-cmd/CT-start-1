name: SC FAIR-MAST P058 N100

on:
  push:
    branches: [sc-fair-mast-p057]
    paths:
      - '.github/workflows/sc-fair-mast-p058-n100.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fair-mast-n100:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reader
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26' 'pandas>=2.0' 'xarray[io]>=2024.1' 'zarr>=3.0' 's3fs>=2025.3.0'
      - name: Execute frozen N100 confirmation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p058-fair-mast-n100/data p058-fair-mast-n100/receipts p058-fair-mast-n100/state
          python - <<'PY'
          import csv, hashlib, io, json, math, traceback, urllib.request
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import xarray as xr
          import s3fs

          OUT=Path('p058-fair-mast-n100')
          ENDPOINT='https://s3.echo.stfc.ac.uk'
          SRC_COMMIT='1a200f4588addaad2ae3d53d438d9e1946c09294'
          SRC_BLOB='78985703becf4cb153487679aaa217912daacc94'
          SRC_PATH='src/MAST_tools/metadata/signal_availability.csv'
          SRC_URL=f'https://raw.githubusercontent.com/UKAEA-IBM-STFC-Fusion-FMs/tokamark/{SRC_COMMIT}/{SRC_PATH}'
          SEED='P058_N100_CONFIRMATION_V1'
          EXCLUDED=[11766,13038,14804,16195,17664,19382,20880,22308,24143,25365,26068,26596,27171,27584,28027,28819,29442,29983]
          PRIMARY=[26867,24004,22430,23667,13742,27169,22287,22162,22215,25697,16731,20570,13274,28997,22382,22300,28860,24717,15898,28816,12228,22309,20495,24474,12964,25696,18328,12088,13766,21771,24514,17712,16151,15703,27401,13108,15993,13644,16862,29047,21517,15507,18531,29488,22526,23598,26953,15113,12901,18496,21797,29440,27198,13557,14583,20862,16828,20428,16036,15153,13583,29077,28267,27450,20651,17999,24665,12931,27601,12474,17964,14017,26651,17901,23485,27125,27640,26163,26463,13093,23143,13430,20514,14520,26004,27050,12202,30048,23489,17768,21344,20465,28811,28178,27822,21785,27740,24528,15279,29229]
          EXPECTED_SELECTION_SHA='b5722a30d6a45c804a7cbc692271ad7a057c505232bd17d26d629d89725d54d6'
          EXPECTED_SELECTION_MANIFEST_SHA='414cccc58b60d8f91a8f1185096f82f00eb0b2af292750eff4c36184ed6213ed'
          FIT={'a_ct':-9.178437415439749,'a_free':-44.513129165037206,'a_null':5.6084749674498156,'b_free':1.1298640950106758,'ct_b':1/3,'fit_rows':43913,'fit_shots':7,'source':'FAIR-MAST_LEVEL2_CAL10','test_bytes_read':False}
          FIT_SHA='80a5741fedcdbf39429f4a24e66b8de2169b0a4bee8a1933fbfcad3f4bf922c8'
          CERT_SHA='bb24f629692aeff388d82fa7d342305346c0df6d06ae6cfbcbe0c6f743be6437'
          TARGET_N=100
          RESERVE_N=50
          BOOT_N=10000
          BOOT_SEED=580100

          # Verify P057 frozen fit and P058 primary selection BEFORE any FAIR-MAST N100 value read.
          fit_bytes=(json.dumps(FIT,indent=2,sort_keys=True)+'\n').encode()
          if hashlib.sha256(fit_bytes).hexdigest()!=FIT_SHA: raise SystemExit('FROZEN_FIT_HASH_MISMATCH')
          if hashlib.sha256(json.dumps(PRIMARY,separators=(',',':')).encode()).hexdigest()!=EXPECTED_SELECTION_SHA: raise SystemExit('PRIMARY_SELECTION_HASH_MISMATCH')

          raw=urllib.request.urlopen(SRC_URL,timeout=60).read()
          rows=list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))))
          eligible=[]
          for r in rows:
              try: sid=int(r['shot_id'])
              except Exception: continue
              if sid in EXCLUDED: continue
              if str(r['thomson_scattering-n_e']).strip().upper()!='TRUE': continue
              if str(r['thomson_scattering-t_e']).strip().upper()!='TRUE': continue
              rank=hashlib.sha256(f'{SEED}:{sid}'.encode()).hexdigest(); eligible.append((rank,sid))
          eligible.sort()
          ranked=[sid for rank,sid in eligible]
          if ranked[:100]!=PRIMARY: raise SystemExit('SELECTION_RECONSTRUCTION_MISMATCH')
          candidates=ranked[:TARGET_N+RESERVE_N]
          reserve=candidates[TARGET_N:]
          reserve_sha=hashlib.sha256(json.dumps(reserve,separators=(',',':')).encode()).hexdigest()
          preflight={
            'pass':'P058','primary_selection_sha256':EXPECTED_SELECTION_SHA,'primary_manifest_sha256':EXPECTED_SELECTION_MANIFEST_SHA,
            'primary_count':100,'reserve_count':len(reserve),'reserve_sha256':reserve_sha,'candidate_count':len(candidates),
            'selection_reconstructed_from_pinned_metadata':True,'n100_values_read_at_preflight':False,
            'reserve_rule':'same SHA256 ranking positions 101-150; used only after primary physical access/pairability failure, never by residual/score',
            'fit_sha256':FIT_SHA,'fit_certificate_sha256':CERT_SHA,'ct_b':FIT['ct_b'],'free_b_frozen':FIT['b_free'],
            'source_commit':SRC_COMMIT,'source_blob_sha1':SRC_BLOB,'source_bytes_sha256':hashlib.sha256(raw).hexdigest()
          }
          (OUT/'PREFLIGHT_AND_SELECTION_BINDING_P058.json').write_text(json.dumps(preflight,indent=2,sort_keys=True)+'\n')

          fs=s3fs.S3FileSystem(anon=True, client_kwargs={'endpoint_url':ENDPOINT})
          receipts=[]; frames=[]; success=[]; primary_fail=[]; reserve_used=[]
          state_vars={
            'summary':['ip','line_average_n_e','power_nbi','power_radiated','greenwald_density','neutron_rates_total'],
            'equilibrium':['q95','whmd','beta_normal','beta_pol','beta_tor','vloop_dynamic','vloop_static'],
            'magnetics':['ip'],
            'pulse_schedule':['i_plasma','n_e_line']
          }
          for order,sid in enumerate(candidates,1):
              if len(success)>=TARGET_N: break
              role='PRIMARY' if order<=TARGET_N else 'RESERVE'
              key=f'mast/level2/shots/{sid}.zarr'
              rec={'shot_id':sid,'candidate_order':order,'selection_role':role,'source':'FAIR-MAST_LEVEL2','source_uri':f's3://{key}',
                   'source_group':'thomson_scattering','fit_sha256':FIT_SHA,'selection_sha256':EXPECTED_SELECTION_SHA,
                   'sc_interpolation_used':False,'provider_processing_notice':'FAIR-MAST level2 may include provider-side cropping/interpolation/calibration'}
              try:
                  mapper=fs.get_mapper(key)
                  ds=xr.open_zarr(mapper,group='thomson_scattering',consolidated=None)
                  if 'n_e' not in ds or 't_e' not in ds: raise KeyError('REQUIRED_THOMSON_VARS_ABSENT')
                  ne=ds['n_e']; te=ds['t_e']; nd=list(ne.dims); td=list(te.dims)
                  if set(nd)!=set(td): raise ValueError('DIMENSION_SET_MISMATCH')
                  if td!=nd: te=te.transpose(*nd)
                  nv=np.asarray(ne.load().values,dtype=float); tv=np.asarray(te.load().values,dtype=float)
                  if nv.shape!=tv.shape: raise ValueError('VALUE_SHAPE_MISMATCH')
                  save={'n_e':nv,'t_e':tv}; coords={}
                  for d in nd:
                      if d not in ne.coords or d not in te.coords: raise ValueError(f'MISSING_COORD:{d}')
                      nc=np.asarray(ne.coords[d].load().values); tc=np.asarray(te.coords[d].load().values)
                      if nc.shape!=tc.shape or not np.array_equal(nc,tc,equal_nan=True): raise ValueError(f'SOURCE_COORDINATE_MISMATCH:{d}')
                      save[f'coord_{d}']=nc; coords[d]={'shape':list(nc.shape),'dtype':str(nc.dtype)}
                  mask=np.isfinite(nv)&np.isfinite(tv)&(nv>0)&(tv>0); idx=np.flatnonzero(mask.reshape(-1))
                  if len(idx)==0: raise ValueError('NO_FINITE_POSITIVE_PAIRS')
                  npz=OUT/'data'/f'SHOT_{sid}_THOMSON_P058.npz'; np.savez_compressed(npz,**save)
                  fn=nv.reshape(-1); ft=tv.reshape(-1)
                  frames.append(pd.DataFrame({'shot_id':sid,'selection_role':role,'n_e':fn[idx],'t_e':ft[idx]}))
                  rec.update({'state':'PAIRED_EXACT','n_e_dims':nd,'t_e_dims':td,'shape':list(nv.shape),'coordinates':coords,
                              'raw_pairs':int(nv.size),'finite_positive_pairs':int(len(idx)),'npz':str(npz.relative_to(OUT)),
                              'npz_sha256':hashlib.sha256(npz.read_bytes()).hexdigest(),'n_e_attrs':{str(k):str(v) for k,v in ne.attrs.items()},
                              't_e_attrs':{str(k):str(v) for k,v in te.attrs.items()}})
                  success.append(sid)
                  if role=='RESERVE': reserve_used.append(sid)

                  # Optional state sidecar, never used in P058 score.
                  state_payload={}; state_meta={}
                  for grp,vars_ in state_vars.items():
                      try:
                          g=xr.open_zarr(mapper,group=grp,consolidated=None)
                          for v in vars_:
                              if v in g:
                                  arr=np.asarray(g[v].load().values)
                                  state_payload[f'{grp}__{v}']=arr
                                  state_meta[f'{grp}.{v}']={'shape':list(arr.shape),'dims':list(g[v].dims),'attrs':{str(k):str(val) for k,val in g[v].attrs.items()}}
                      except Exception as se:
                          state_meta[f'{grp}.__group_error__']=f'{type(se).__name__}: {se}'
                  if state_payload:
                      sp=OUT/'state'/f'SHOT_{sid}_STATE_P058.npz'; np.savez_compressed(sp,**state_payload)
                      rec['state_sidecar_npz']=str(sp.relative_to(OUT)); rec['state_sidecar_sha256']=hashlib.sha256(sp.read_bytes()).hexdigest()
                  rec['state_sidecar_metadata']=state_meta; rec['state_sidecar_used_for_score']=False
              except Exception as e:
                  rec.update({'state':'FAILED','error_type':type(e).__name__,'error':str(e),'traceback':traceback.format_exc()})
                  if role=='PRIMARY': primary_fail.append(sid)
              receipts.append(rec)
              (OUT/'receipts'/f'SHOT_{sid}_RECEIPT_P058.json').write_text(json.dumps(rec,indent=2,sort_keys=True,default=lambda x:x.item() if isinstance(x,np.generic) else str(x))+'\n')

          if len(success)<TARGET_N:
              raise SystemExit(f'N100_UNDERCOVERED:{len(success)}')
          test=pd.concat(frames,ignore_index=True)
          if test.shot_id.nunique()!=TARGET_N: raise SystemExit('DISTINCT_SHOT_COUNT_MISMATCH')
          x=np.log(test.n_e.to_numpy(float)); y=np.log(test.t_e.to_numpy(float))
          pred_ct=FIT['a_ct']+FIT['ct_b']*x
          pred_free=FIT['a_free']+FIT['b_free']*x
          pred_null=np.full_like(y,FIT['a_null'])
          sq={'CT_FIXED_1_3':(y-pred_ct)**2,'FREE_POWER_LAW':(y-pred_free)**2,'NULL_LOG_MEAN':(y-pred_null)**2}
          errs={k:float(v.mean()) for k,v in sq.items()}
          best=min(('FREE_POWER_LAW','NULL_LOG_MEAN'),key=lambda k:errs[k])
          delta=float(errs[best]-errs['CT_FIXED_1_3'])

          per_shot={}; sb={k:[] for k in sq}; sums={k:[] for k in sq}; counts=[]
          for sid,g in test.groupby('shot_id',sort=False):
              ii=g.index.to_numpy(); counts.append(len(ii))
              ed={k:float(sq[k][ii].mean()) for k in sq}
              for k in sq: sb[k].append(ed[k]); sums[k].append(float(sq[k][ii].sum()))
              per_shot[str(int(sid))]={'pairs':int(len(ii)),'E_CT':ed['CT_FIXED_1_3'],'E_FREE':ed['FREE_POWER_LAW'],'E_NULL':ed['NULL_LOG_MEAN'],
                                          'delta_best_minus_ct':float(min(ed['FREE_POWER_LAW'],ed['NULL_LOG_MEAN'])-ed['CT_FIXED_1_3'])}
          shot_bal={k:float(np.mean(v)) for k,v in sb.items()}
          delta_sb=float(min(shot_bal['FREE_POWER_LAW'],shot_bal['NULL_LOG_MEAN'])-shot_bal['CT_FIXED_1_3'])
          dshots=np.array([v['delta_best_minus_ct'] for v in per_shot.values()],dtype=float)
          neg=int((dshots<0).sum()); pos=int((dshots>0).sum()); zero=int((dshots==0).sum())

          # Shot-level bootstrap. Pair-weighted bootstrap preserves each shot's complete within-shot payload.
          rng=np.random.default_rng(BOOT_SEED); n=len(counts); counts=np.asarray(counts,float)
          sums={k:np.asarray(v,float) for k,v in sums.items()}; sb={k:np.asarray(v,float) for k,v in sb.items()}
          bpair=np.empty(BOOT_N); bsb=np.empty(BOOT_N)
          for b in range(BOOT_N):
              ix=rng.integers(0,n,size=n)
              den=counts[ix].sum()
              be={k:float(sums[k][ix].sum()/den) for k in sq}
              bpair[b]=min(be['FREE_POWER_LAW'],be['NULL_LOG_MEAN'])-be['CT_FIXED_1_3']
              bse={k:float(sb[k][ix].mean()) for k in sq}
              bsb[b]=min(bse['FREE_POWER_LAW'],bse['NULL_LOG_MEAN'])-bse['CT_FIXED_1_3']
          ci_pair=[float(np.quantile(bpair,.025)),float(np.quantile(bpair,.975))]
          ci_sb=[float(np.quantile(bsb,.025)),float(np.quantile(bsb,.975))]
          sign_p_one=float(sum(math.comb(n,k) for k in range(0,min(neg,pos)+1))/(2**n)) if zero==0 else None

          result={
            'pass':'P058','object':'FAIR_MAST_CORRECTED_PROVIDER_N100_CONFIRMATION','protocol':'P057_FROZEN_CAL10_FIT_PLUS_P058_BLIND_N100',
            'primary_selection_sha256':EXPECTED_SELECTION_SHA,'effective_pairable_shots':success,'effective_pairable_count':len(success),
            'primary_failures':primary_fail,'primary_failure_count':len(primary_fail),'reserve_used':reserve_used,'reserve_used_count':len(reserve_used),
            'test_rows':int(len(test)),'fit_sha256':FIT_SHA,'fit_certificate_sha256':CERT_SHA,'fit_frozen_before_n100':True,'test_refit':False,
            'ct_b':FIT['ct_b'],'free_b_frozen':FIT['b_free'],'test_mse_log_te':errs,'test_shot_balanced_mse_log_te':shot_bal,
            'best_frozen_comparator':best,'Delta_1_N100_best_minus_ct':delta,'Delta_1_N100_shot_balanced_best_minus_ct':delta_sb,'positive_favors_CT':True,
            'per_shot_diagnostics':per_shot,'negative_shots':neg,'positive_shots':pos,'zero_shots':zero,
            'bootstrap':{'resamples':BOOT_N,'seed':BOOT_SEED,'pair_weighted_delta_ci95':ci_pair,'shot_balanced_delta_ci95':ci_sb,
                         'pair_weighted_fraction_positive':float((bpair>0).mean()),'shot_balanced_fraction_positive':float((bsb>0).mean())},
            'sign_test_one_sided_extreme_direction_p':sign_p_one,
            'provider':'FAIR-MAST_LEVEL2','provider_scope_only':True,'strict_tokamark_provider_equivalence_proved':False,
            'scientific_promotion':'CONDITIONAL_ON_PROVIDER_SCOPE_AND_PROCESSING; DOES_NOT_PROMOTE_OR_REFUTE_ALL_CT',
            'state_sidecars_captured_but_not_used_for_score':True
          }
          (OUT/'P058_N100_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          summary={'selected_primary':100,'primary_failed':len(primary_fail),'reserve_used':len(reserve_used),'effective_pairable':len(success),
                   'rows':len(test),'delta_pair_weighted':delta,'delta_shot_balanced':delta_sb,'best_comparator':best,'negative_shots':neg,
                   'positive_shots':pos,'ci95_pair_weighted':ci_pair,'ci95_shot_balanced':ci_sb}
          (OUT/'P058_N100_SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (OUT/'P058_N100_RECEIPTS.json').write_text(json.dumps(receipts,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Hash payload
        if: always()
        run: |
          if [ -d p058-fair-mast-n100 ]; then find p058-fair-mast-n100 -type f ! -name SHA256SUMS_P058.txt -print0 | sort -z | xargs -0 sha256sum > p058-fair-mast-n100/SHA256SUMS_P058.txt; fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p058-fair-mast-n100
          path: p058-fair-mast-n100
          if-no-files-found: error
          retention-days: 1
