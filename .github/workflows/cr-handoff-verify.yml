name: CR handoff verify

on:
  push:
    branches: [main, ac82-bulk-evidence-vault-20260926]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CR runtime dependencies
        run: python -m pip install -r requirements-cr.txt pytest

      - name: Verify AC78 base artifact
        run: python scripts/verify_cr_artifacts.py

      - name: Verify AC82 overlay hash
        run: |
          echo "00a7adcc0f00f370667f041e3c82add64b6ac8e42a722abbf44321fc693257fc  artifacts/releases/AC82_FROM_AC78_OVERLAY_20260926.tar.xz" | sha256sum -c -

      - name: Reconstruct AC82
        run: |
          mkdir -p .ci/ac82
          tar -xJf artifacts/releases/AC78_HYPERTRIANGLE_CORE_SOURCE_20260925.tar.xz -C .ci/ac82
          tar -xJf artifacts/releases/AC82_FROM_AC78_OVERLAY_20260926.tar.xz -C .ci/ac82

      - name: AC82 targeted regression qualification
        run: |
          python -m pytest -q             .ci/ac82/03_TESTS/test_ac79_progress_fixed_point.py             .ci/ac82/03_TESTS/test_ac81_sovereign_stop.py             .ci/ac82/03_TESTS/test_ac82_bulk_evidence_vault.py

      - name: AC82 state gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".ci/ac82/00_STATE/AC82_STATE.json")
          s=json.loads(p.read_text())
          assert s["version"] == "AC82"
          assert s["status"] == "QUALIFIED"
          assert s["bulk_relation_vault"] is True
          assert s["sovereign_stop"] is True
          assert s["truth_credit_added"] == 0
          print("AC82 state gate PASS")
          PY
