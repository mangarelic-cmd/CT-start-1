name: CR handoff verify

on:
  push:
    branches: [main, ac79-progress-aware-fixed-point-20260926]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CR runtime dependencies
        run: python -m pip install -r requirements-cr.txt pytest==9.0.2

      - name: Verify historical embedded artifact hashes
        run: python scripts/verify_cr_artifacts.py

      - name: Verify AC79 delta
        run: python scripts/verify_ac79_delta.py

      - name: Reconstruct AC79 from AC78
        run: bash scripts/reconstruct_ac79.sh .ci/ac79

      - name: AC79 progress-aware fixed-point tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .ci/ac79/02_RUNTIME
        run: python -m pytest -q .ci/ac79/03_TESTS/test_ac79_progress_fixed_point.py

      - name: AC79 qualification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .ci/ac79/02_RUNTIME
        run: python .ci/ac79/02_RUNTIME/run_ac79_qualification.py
