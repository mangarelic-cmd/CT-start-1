name: Decoherence Hardware V1P002

on:
  push:
    branches: [decoherence-hardware-v1p002]
    paths:
      - 'hardware/decoherence_v1p002/**'
      - '.github/workflows/decoherence-hardware-v1p002.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
  QISKIT_IBM_INSTANCE: ${{ secrets.QISKIT_IBM_INSTANCE }}
  QISKIT_IBM_CHANNEL: ibm_quantum_platform
  IBM_BACKEND: ibm_fez

jobs:
  hardware-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qiskit Runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'qiskit>=2.0' 'qiskit-ibm-runtime>=0.40'
      - name: Verify IBM credential is present
        shell: bash
        run: |
          if [ -z "$QISKIT_IBM_TOKEN" ]; then
            echo 'QISKIT_IBM_TOKEN repository secret is missing.' >&2
            exit 86
          fi
      - name: Execute frozen matched hardware pass
        run: python hardware/decoherence_v1p002/hardware_pass_live.py
      - name: Show terminal score
        if: always()
        shell: bash
        run: |
          if [ -f HARDWARE_RUN/HARDWARE_SCORE_V2.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('HARDWARE_RUN/HARDWARE_SCORE_V2.json'))
          print('STATUS=',x.get('status'))
          print('BACKEND=',x.get('backend'))
          print('QUBIT=',x.get('qubit'))
          print('PRECOMMIT=',x.get('precommit_sha256'))
          PY
          fi
      - name: Upload hardware receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoherence-hardware-v1p002
          path: HARDWARE_RUN/
          if-no-files-found: warn
          retention-days: 90
