name: SC FAIR-MAST P065 PRETE UMEAN
on:
  push:
    branches: [sc-fair-mast-p057]
    paths: ['.github/workflows/sc-fair-mast-p065-prete-umean.yml']
permissions: {contents: read}
jobs:
  prete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'numpy>=1.26' 'pandas>=2.0' 'xarray[io]>=2024.1' 'zarr>=3.0' 's3fs>=2025.3.0'
      - name: Compute strict pre-Te shot coordinate
        run: |
          python - <<'PY'
          import json,math,traceback
          from pathlib import Path
          import numpy as np,pandas as pd,xarray as xr,s3fs
          shots=[15340,18743,23457,17921,17098,12168,13365,24821,27731,13797,13632,20708,15325,24896,24619,16265,20107,17820,18578,16396,17994,21066,13696,14621,20508,15109,22657,23530,20036,17823]
          MU_N5=1198323.3541824967;SD_N5=1182370.4221535327;L=np.log(1e19)
          fs=s3fs.S3FileSystem(anon=True,client_kwargs={'endpoint_url':'https://s3.echo.stfc.ac.uk'});rows=[]
          def gettime(ds):
            if 'time' in ds.coords:return np.asarray(ds.coords['time'].load().values,float).reshape(-1)
            if 'time' in ds:return np.asarray(ds['time'].load().values,float).reshape(-1)
            for c in ds.coords:
              if 'time' in c.lower():return np.asarray(ds.coords[c].load().values,float).reshape(-1)
            raise KeyError('NO_TIME')
          def orient(var,t):
            a=np.asarray(var.load().values,float);d=list(var.dims)
            if 'time' in d:a=np.moveaxis(a,d.index('time'),-1)
            elif a.shape[-1]==len(t):pass
            elif a.shape[0]==len(t):a=np.moveaxis(a,0,-1)
            else:raise ValueError('NO_TIME_AXIS')
            return a.reshape((-1,len(t)))
          def series(ds,v):
            t=gettime(ds);a=np.squeeze(np.asarray(ds[v].load().values,float))
            if a.ndim!=1 or len(a)!=len(t):raise ValueError('BAD_SERIES_'+v)
            return t,a
          def interp(t,v,q):
            m=np.isfinite(t)&np.isfinite(v);t=t[m];v=v[m]
            if len(t)<2:return np.full(len(q),np.nan)
            o=np.argsort(t);t=t[o];v=v[o];t,ix=np.unique(t,return_index=True);v=v[ix]
            z=np.interp(q,t,v,left=np.nan,right=np.nan);z[(q<t[0])|(q>t[-1])]=np.nan;return z
          for sid in shots:
            r={'shot_id':sid,'te_loaded':False,'status':'OPEN'}
            try:
              mp=fs.get_mapper(f'mast/level2/shots/{sid}.zarr');th=xr.open_zarr(mp,group='thomson_scattering',consolidated=None);tt=gettime(th);ne=orient(th['n_e'],tt)
              su=xr.open_zarr(mp,group='summary',consolidated=None);tg,vg=series(su,'greenwald_density');tn,vn=series(su,'power_nbi');gw=interp(tg,vg,tt);nbi=interp(tn,vn,tt)
              ub=[];gb=[];npts=0
              for j in range(len(tt)):
                if not(np.isfinite(gw[j]) and gw[j]>0 and np.isfinite(nbi[j])):continue
                m=np.isfinite(ne[:,j])&(ne[:,j]>0)
                if not m.any():continue
                x=np.log(ne[m,j]);zn=(nbi[j]-MU_N5)/SD_N5;u=(x-L)-(4/3)*(np.log(gw[j])-L)-(1/5)*zn+4/3
                ubar=float(np.median(u));ub.append(ubar);gb.append(float(1/(1+np.exp(-np.clip(7*ubar,-60,60)))));npts+=int(m.sum())
              if not ub:raise ValueError('NO_PRETE_STATE_POINTS')
              r.update({'status':'USABLE','n_times':len(ub),'n_ne_points':npts,'u_time_mean':float(np.mean(ub)),'u_time_median':float(np.median(ub)),'u_time_std':float(np.std(ub)),'gate_time_mean':float(np.mean(gb)),'gate_time_median':float(np.median(gb))})
            except Exception as e:r.update({'status':'FAILED','error_type':type(e).__name__,'error':str(e)})
            rows.append(r);print(r)
          out=Path('p065-prete');out.mkdir();pd.DataFrame(rows).to_csv(out/'STRICT_PRETE_REGIME_COORDINATE_P065.csv',index=False)
          A=pd.read_csv('scripts/p065_c185_input_p064.csv');D=A.merge(pd.DataFrame(rows),on='shot_id',how='left');D['target']=(D.m6<D.m5).astype(int)
          # Scan threshold on strict u_time_mean for diagnostic, then compare simple constants.
          V=D[D.status=='USABLE'].sort_values('u_time_mean');vals=V.u_time_mean.values;cuts=(vals[:-1]+vals[1:])/2;cands=list(cuts)+[1-math.sqrt(2),-0.5,-1/math.pi,-1/3,-0.25,0]
          rec=[]
          for c in cands:
            p=(V.u_time_mean>c).astype(int).values;m=np.where(p==1,V.m6,V.m5);rec.append({'threshold':float(c),'mse':float(np.mean(m)),'wins_selected':int(p.sum()),'accuracy':float(np.mean(p==V.target.values))})
          R=pd.DataFrame(rec).sort_values(['mse','threshold']);R.to_csv(out/'STRICT_PRETE_THRESHOLD_SCAN_P065.csv',index=False)
          best=R.iloc[0].to_dict();exact=R.iloc[(R.threshold-(1-math.sqrt(2))).abs().argmin()].to_dict()
          (out/'STRICT_PRETE_FREEZE_DIAGNOSTIC_P065.json').write_text(json.dumps({'best':best,'exact_1_minus_sqrt2':exact,'usable_shots':int((D.status=='USABLE').sum()),'te_loaded':False,'execution_inputs':['n_e','summary.greenwald_density','summary.power_nbi']},indent=2,sort_keys=True)+'\n')
          PY
      - name: Hash
        run: find p065-prete -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > p065-prete/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: p065-prete-regime, path: p065-prete, retention-days: 1}
