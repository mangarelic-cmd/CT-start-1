name: SC FAIR-MAST P057 TEST8

on:
  push:
    branches: [sc-fair-mast-p057]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fair-mast-test8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FAIR-MAST reader
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26' 'pandas>=2.0' 'xarray[io]>=2024.1' 'zarr>=3.0' 's3fs>=2025.3.0'
      - name: Acquire TEST8 and score frozen fit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p057-fair-mast-test
          python - <<'PY'
          import hashlib, json, traceback
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import xarray as xr
          import s3fs

          OUT=Path('p057-fair-mast-test')
          ENDPOINT='https://s3.echo.stfc.ac.uk'
          TEST=[
              (26068,'M8'),(26596,'M8'),(27171,'M8'),(27584,'M8'),
              (28027,'M8'),(28819,'M9'),(29442,'M9'),(29983,'M9')]
          CT_B=1.0/3.0
          MIN_TEST_SHOTS=6
          FIT={
              'a_ct':-9.178437415439749,
              'a_free':-44.513129165037206,
              'a_null':5.6084749674498156,
              'b_free':1.1298640950106758,
              'ct_b':0.3333333333333333,
              'fit_rows':43913,
              'fit_shots':7,
              'source':'FAIR-MAST_LEVEL2_CAL10',
              'test_bytes_read':False,
          }
          EXPECTED_FIT_SHA='80a5741fedcdbf39429f4a24e66b8de2169b0a4bee8a1933fbfcad3f4bf922c8'
          CERT={
              'certificate_type':'P057_FAIR_MAST_FROZEN_REAL_FIT',
              'ct_b':0.3333333333333333,
              'fit_rows':43913,
              'fit_sha256':EXPECTED_FIT_SHA,
              'fit_shots':7,
              'provider':'FAIR-MAST_LEVEL2',
              'test_bytes_read':False,
          }
          EXPECTED_CERT_SHA='bb24f629692aeff388d82fa7d342305346c0df6d06ae6cfbcbe0c6f743be6437'

          fit_bytes=(json.dumps(FIT,indent=2,sort_keys=True)+'\n').encode()
          cert_bytes=(json.dumps(CERT,indent=2,sort_keys=True)+'\n').encode()
          got_fit_sha=hashlib.sha256(fit_bytes).hexdigest()
          got_cert_sha=hashlib.sha256(cert_bytes).hexdigest()
          if got_fit_sha!=EXPECTED_FIT_SHA: raise SystemExit(f'FROZEN_FIT_HASH_MISMATCH:{got_fit_sha}')
          if got_cert_sha!=EXPECTED_CERT_SHA: raise SystemExit(f'FROZEN_CERT_HASH_MISMATCH:{got_cert_sha}')
          (OUT/'FROZEN_REAL_FIT_P057.json').write_bytes(fit_bytes)
          (OUT/'FIT_CERTIFICATE_P057.json').write_bytes(cert_bytes)

          fs=s3fs.S3FileSystem(anon=True, client_kwargs={'endpoint_url':ENDPOINT})
          receipts=[]; frames=[]
          def jdefault(x):
              if isinstance(x,np.generic): return x.item()
              raise TypeError(type(x).__name__)

          for sid,campaign in TEST:
              key=f'mast/level2/shots/{sid}.zarr'
              rec={'shot_id':sid,'campaign':campaign,'split':'test','source':'FAIR-MAST_LEVEL2',
                   'source_uri':f's3://{key}','https_uri':f'{ENDPOINT}/{key}',
                   'source_group':'thomson_scattering','provider_level':'level2',
                   'provider_processing_notice':'FAIR-MAST level2 may include provider-side cropping/interpolation/calibration; no SC-side interpolation is applied',
                   'sc_interpolation_used':False,'fit_sha256':EXPECTED_FIT_SHA,
                   'fit_certificate_sha256':EXPECTED_CERT_SHA}
              try:
                  mapper=fs.get_mapper(key)
                  ds=xr.open_zarr(mapper,group='thomson_scattering',consolidated=None)
                  if 'n_e' not in ds or 't_e' not in ds:
                      raise KeyError(f"required vars absent; vars={list(ds.data_vars)}")
                  ne=ds['n_e']; te=ds['t_e']
                  ne_dims=list(ne.dims); te_dims=list(te.dims)
                  rec['n_e_dims']=ne_dims; rec['t_e_dims']=te_dims
                  rec['n_e_shape']=list(ne.shape); rec['t_e_shape']=list(te.shape)
                  rec['n_e_attrs']={str(k):str(v) for k,v in ne.attrs.items()}
                  rec['t_e_attrs']={str(k):str(v) for k,v in te.attrs.items()}
                  if set(ne_dims)!=set(te_dims): raise ValueError('DIMENSION_SET_MISMATCH')
                  if te_dims!=ne_dims: te=te.transpose(*ne_dims)
                  nv=np.asarray(ne.load().values,dtype=float)
                  tv=np.asarray(te.load().values,dtype=float)
                  if nv.shape!=tv.shape: raise ValueError('VALUE_SHAPE_MISMATCH')
                  save={'n_e':nv,'t_e':tv}
                  coord_report={}
                  for d in ne_dims:
                      if d not in ne.coords or d not in te.coords: raise ValueError(f'MISSING_COORD:{d}')
                      nc=np.asarray(ne.coords[d].load().values)
                      tc=np.asarray(te.coords[d].load().values)
                      if nc.shape!=tc.shape or not np.array_equal(nc,tc,equal_nan=True):
                          raise ValueError(f'SOURCE_COORDINATE_MISMATCH:{d}')
                      save[f'coord_{d}']=nc
                      coord_report[d]={'shape':list(nc.shape),'dtype':str(nc.dtype)}
                  rec['coordinates']=coord_report
                  finite=np.isfinite(nv)&np.isfinite(tv)
                  pos=finite&(nv>0)&(tv>0)
                  idx=np.flatnonzero(pos.reshape(-1))
                  rec['raw_pairs']=int(nv.size); rec['finite_positive_pairs']=int(len(idx))
                  if len(idx)==0: raise ValueError('NO_FINITE_POSITIVE_PAIRS')
                  npz=OUT/f'SHOT_{sid}_THOMSON.npz'; np.savez_compressed(npz,**save)
                  rec['npz']=npz.name; rec['npz_sha256']=hashlib.sha256(npz.read_bytes()).hexdigest()
                  fn=nv.reshape(-1); ft=tv.reshape(-1)
                  frames.append(pd.DataFrame({'shot_id':sid,'campaign':campaign,'split':'test',
                                              'n_e':fn[idx],'t_e':ft[idx]}))
                  rec['state']='PAIRED_EXACT'
              except Exception as e:
                  rec['state']='FAILED'; rec['error_type']=type(e).__name__; rec['error']=str(e)
                  rec['traceback']=traceback.format_exc()
              receipts.append(rec)
              (OUT/f'SHOT_{sid}_RECEIPT.json').write_text(json.dumps(rec,indent=2,sort_keys=True,default=jdefault)+'\n')

          pairable=[r for r in receipts if r.get('state')=='PAIRED_EXACT']
          test=pd.concat(frames,ignore_index=True) if frames else pd.DataFrame(columns=['shot_id','campaign','split','n_e','t_e'])
          summary={'phase':'TEST','expected_shots':[x[0] for x in TEST],
                   'pairable_shots':len(pairable),'failed_shots':len(TEST)-len(pairable),
                   'admissible_pairs':int(len(test)),'fit_frozen_before_test':True,
                   'fit_sha256':EXPECTED_FIT_SHA,'fit_certificate_sha256':EXPECTED_CERT_SHA,
                   'provider':'FAIR-MAST level2','sc_side_interpolation':False}

          result={'calibration_binding':{'fit':FIT,'fit_sha256':EXPECTED_FIT_SHA,
                                         'fit_certificate_sha256':EXPECTED_CERT_SHA,
                                         'cal_pairable_shots':7,'cal_admissible_pairs':43913,
                                         'test_bytes_read_during_cal':False},
                  'test_summary':summary,'scientific_promotion':False,
                  'sovereign_Delta1_computed':False}
          if len(test):
              x=np.log(test.n_e.to_numpy(float)); y=np.log(test.t_e.to_numpy(float))
              pred={
                  'CT_FIXED_1_3':FIT['a_ct']+CT_B*x,
                  'FREE_POWER_LAW':FIT['a_free']+FIT['b_free']*x,
                  'NULL_LOG_MEAN':np.full_like(y,FIT['a_null'])}
              errs={k:float(np.mean((y-v)**2)) for k,v in pred.items()}
              best=min(('FREE_POWER_LAW','NULL_LOG_MEAN'),key=lambda k:errs[k])
              delta=float(errs[best]-errs['CT_FIXED_1_3'])
              shot_bal={}; per_shot={}
              for k,p in pred.items():
                  t=pd.DataFrame({'shot_id':test.shot_id.to_numpy(),'sq':(y-p)**2})
                  shot_bal[k]=float(t.groupby('shot_id')['sq'].mean().mean())
              for sid,g in test.groupby('shot_id'):
                  pos=g.index.to_numpy(); sx=x[pos]; sy=y[pos]
                  se_ct=float(np.mean((sy-(FIT['a_ct']+CT_B*sx))**2))
                  se_free=float(np.mean((sy-(FIT['a_free']+FIT['b_free']*sx))**2))
                  se_null=float(np.mean((sy-FIT['a_null'])**2))
                  per_shot[str(int(sid))]={'pairs':int(len(g)),'campaign':str(g.campaign.iloc[0]),
                      'E_CT':se_ct,'E_FREE':se_free,'E_NULL':se_null,
                      'delta_best_minus_ct':float(min(se_free,se_null)-se_ct)}
              camps={}
              for camp,g in test.groupby('campaign',dropna=False):
                  pos=g.index.to_numpy(); cx=x[pos]; cy=y[pos]
                  ce_ct=float(np.mean((cy-(FIT['a_ct']+CT_B*cx))**2))
                  ce_free=float(np.mean((cy-(FIT['a_free']+FIT['b_free']*cx))**2))
                  ce_null=float(np.mean((cy-FIT['a_null'])**2))
                  camps[str(camp)]={'shots':int(g.shot_id.nunique()),'pairs':int(len(g)),
                      'E_CT':ce_ct,'E_FREE':ce_free,'E_NULL':ce_null,
                      'delta_best_minus_ct':float(min(ce_free,ce_null)-ce_ct)}
              result['micro_score']={
                  'role':'EXPLORATORY_N10_MICROTREND_ONLY','fixed_test_list_size':8,
                  'test_rows':int(len(test)),'test_shots':int(test.shot_id.nunique()),
                  'test_mse_log_te':errs,'test_shot_balanced_mse_log_te':shot_bal,
                  'best_frozen_comparator_on_microtest':best,
                  'Delta_1_micro_best_minus_ct':delta,'positive_favors_CT':True,
                  'per_shot_diagnostics':per_shot,'campaign_diagnostics':camps,
                  'microtrend_valid':bool(test.shot_id.nunique()>=MIN_TEST_SHOTS),
                  'scientific_promotion':False,'sovereign_Delta_1_computed':False}
              result['Delta1_micro_computed']=bool(test.shot_id.nunique()>=MIN_TEST_SHOTS)
          else:
              result['micro_score']={'microtrend_valid':False,'reason':'NO_TEST_PAIRS'}
              result['Delta1_micro_computed']=False

          (OUT/'TEST_RECEIPTS_P057.json').write_text(json.dumps(receipts,indent=2,sort_keys=True,default=jdefault)+'\n')
          (OUT/'TEST_SUMMARY_P057.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (OUT/'P057_MICRO_TERMINAL_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if len(pairable)<MIN_TEST_SHOTS: raise SystemExit('TEST_UNDERCOVERED')
          PY
      - name: Hash TEST payload
        if: always()
        run: |
          if [ -d p057-fair-mast-test ]; then find p057-fair-mast-test -maxdepth 1 -type f ! -name SHA256SUMS_P057_TEST.txt -print0 | sort -z | xargs -0 sha256sum > p057-fair-mast-test/SHA256SUMS_P057_TEST.txt; fi
      - name: Upload TEST artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p057-fair-mast-test
          path: p057-fair-mast-test
          if-no-files-found: error
          retention-days: 1
