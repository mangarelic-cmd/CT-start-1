name: Cancel P058 Heavy
on:
  push:
    branches: [sc-fair-mast-p057]
    paths:
      - '.github/workflows/sc-cancel-p058-heavy.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel state-enriched P058 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mangarelic-cmd/CT-start-1/actions/runs/32039200189/cancel
