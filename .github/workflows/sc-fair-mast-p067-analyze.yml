name: SC FAIR-MAST P067 ALLAUX ANALYZE
on:
  push:
    branches: [sc-fair-mast-p057]
    paths: ['.github/workflows/sc-fair-mast-p067-analyze.yml']
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: sc-fair-mast-p057}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'numpy>=1.26' 'pandas>=2.0' 'xarray[io]>=2024.1' 'zarr>=3.0' 's3fs>=2025.3.0'
      - name: Execute all AUX three-round analysis
        run: python scripts/p067_allaux_rounds_analyze.py
      - name: Seal hashes and provenance
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('P067_ANALYSIS_AUTHORITY')
          (p/'RUN_PROVENANCE_P067_ANALYSIS.json').write_text(json.dumps({'schema':'P067_ANALYSIS_AUTHORITY_V1','run_id':os.environ.get('GITHUB_RUN_ID'),'head_sha':os.environ.get('GITHUB_SHA'),'workflow':'sc-fair-mast-p067-analyze.yml'},indent=2,sort_keys=True)+'\n')
          PY
          find P067_ANALYSIS_AUTHORITY -type f ! -name SHA256SUMS_FINAL.txt -print0 | sort -z | xargs -0 sha256sum > P067_ANALYSIS_AUTHORITY/SHA256SUMS_FINAL.txt
      - name: Commit analysis authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add P067_ANALYSIS_AUTHORITY
          git commit -m 'P067 materialize all-AUX three-round analysis' || exit 0
          git push origin HEAD:sc-fair-mast-p057
