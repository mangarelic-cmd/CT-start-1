name: SC FAIR-MAST P058 N100 SCORE ONLY

on:
  push:
    branches: [sc-fair-mast-p057]
    paths:
      - '.github/workflows/sc-fair-mast-p058-score-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n100-score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reader
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26' 'pandas>=2.0' 'xarray>=2024.1' 'zarr>=3.0' 's3fs>=2025.3.0'
      - name: Execute frozen N100 score only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p058-score-only/data p058-score-only/receipts
          python - <<'PY'
          import csv, hashlib, io, json, math, traceback, urllib.request
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import xarray as xr
          import s3fs

          OUT=Path('p058-score-only')
          ENDPOINT='https://s3.echo.stfc.ac.uk'
          COMMIT='1a200f4588addaad2ae3d53d438d9e1946c09294'
          BLOB='78985703becf4cb153487679aaa217912daacc94'
          PATH='src/MAST_tools/metadata/signal_availability.csv'
          URL=f'https://raw.githubusercontent.com/UKAEA-IBM-STFC-Fusion-FMs/tokamark/{COMMIT}/{PATH}'
          SEED='P058_N100_CONFIRMATION_V1'
          EX=[11766,13038,14804,16195,17664,19382,20880,22308,24143,25365,26068,26596,27171,27584,28027,28819,29442,29983]
          PRIMARY=[26867,24004,22430,23667,13742,27169,22287,22162,22215,25697,16731,20570,13274,28997,22382,22300,28860,24717,15898,28816,12228,22309,20495,24474,12964,25696,18328,12088,13766,21771,24514,17712,16151,15703,27401,13108,15993,13644,16862,29047,21517,15507,18531,29488,22526,23598,26953,15113,12901,18496,21797,29440,27198,13557,14583,20862,16828,20428,16036,15153,13583,29077,28267,27450,20651,17999,24665,12931,27601,12474,17964,14017,26651,17901,23485,27125,27640,26163,26463,13093,23143,13430,20514,14520,26004,27050,12202,30048,23489,17768,21344,20465,28811,28178,27822,21785,27740,24528,15279,29229]
          SEL_SHA='b5722a30d6a45c804a7cbc692271ad7a057c505232bd17d26d629d89725d54d6'
          SEL_MAN_SHA='414cccc58b60d8f91a8f1185096f82f00eb0b2af292750eff4c36184ed6213ed'
          FIT={'a_ct':-9.178437415439749,'a_free':-44.513129165037206,'a_null':5.6084749674498156,'b_free':1.1298640950106758,'ct_b':1/3,'fit_rows':43913,'fit_shots':7,'source':'FAIR-MAST_LEVEL2_CAL10','test_bytes_read':False}
          FIT_SHA='80a5741fedcdbf39429f4a24e66b8de2169b0a4bee8a1933fbfcad3f4bf922c8'
          CERT_SHA='bb24f629692aeff388d82fa7d342305346c0df6d06ae6cfbcbe0c6f743be6437'
          TARGET=100; RESERVE=80; BOOT=10000; BOOT_SEED=580100

          fit_bytes=(json.dumps(FIT,indent=2,sort_keys=True)+'\n').encode()
          assert hashlib.sha256(fit_bytes).hexdigest()==FIT_SHA
          assert hashlib.sha256(json.dumps(PRIMARY,separators=(',',':')).encode()).hexdigest()==SEL_SHA

          raw=urllib.request.urlopen(URL,timeout=60).read(); rows=list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))))
          elig=[]
          for r in rows:
              try: sid=int(r['shot_id'])
              except Exception: continue
              if sid in EX: continue
              if str(r['thomson_scattering-n_e']).strip().upper()!='TRUE' or str(r['thomson_scattering-t_e']).strip().upper()!='TRUE': continue
              elig.append((hashlib.sha256(f'{SEED}:{sid}'.encode()).hexdigest(),sid))
          elig.sort(); ranked=[s for _,s in elig]
          if ranked[:100]!=PRIMARY: raise SystemExit('SELECTION_RECONSTRUCTION_MISMATCH')
          cand=ranked[:TARGET+RESERVE]; reserve=cand[TARGET:]
          pre={'pass':'P058','authority':'SCORE_ONLY_AFTER_CANCELLED_STATE_ENRICHED_NON_AUTHORITY_RUN','fit_sha256':FIT_SHA,'fit_certificate_sha256':CERT_SHA,
               'selection_sha256':SEL_SHA,'selection_manifest_sha256':SEL_MAN_SHA,'source_commit':COMMIT,'source_blob_sha1':BLOB,
               'source_bytes_sha256':hashlib.sha256(raw).hexdigest(),'primary_count':100,'reserve_count':len(reserve),
               'reserve_sha256':hashlib.sha256(json.dumps(reserve,separators=(',',':')).encode()).hexdigest(),
               'n100_values_read_before_preflight':False,'test_refit':False,'state_variables_used':False}
          (OUT/'P058_SCORE_ONLY_PREFLIGHT.json').write_text(json.dumps(pre,indent=2,sort_keys=True)+'\n')

          fs=s3fs.S3FileSystem(anon=True,client_kwargs={'endpoint_url':ENDPOINT})
          receipts=[]; frames=[]; success=[]; primary_fail=[]; reserve_used=[]
          for order,sid in enumerate(cand,1):
              if len(success)>=TARGET: break
              role='PRIMARY' if order<=100 else 'RESERVE'; key=f'mast/level2/shots/{sid}.zarr'
              rec={'shot_id':sid,'candidate_order':order,'selection_role':role,'source_uri':f's3://{key}','group':'thomson_scattering',
                   'selection_sha256':SEL_SHA,'fit_sha256':FIT_SHA,'sc_interpolation_used':False}
              try:
                  mapper=fs.get_mapper(key); ds=xr.open_zarr(mapper,group='thomson_scattering',consolidated=None)
                  if 'n_e' not in ds or 't_e' not in ds: raise KeyError('REQUIRED_THOMSON_VARS_ABSENT')
                  ne=ds['n_e']; te=ds['t_e']; nd=list(ne.dims); td=list(te.dims)
                  if set(nd)!=set(td): raise ValueError('DIMENSION_SET_MISMATCH')
                  if td!=nd: te=te.transpose(*nd)
                  nv=np.asarray(ne.load().values,dtype=float); tv=np.asarray(te.load().values,dtype=float)
                  if nv.shape!=tv.shape: raise ValueError('VALUE_SHAPE_MISMATCH')
                  save={'n_e':nv,'t_e':tv}; coords={}
                  for d in nd:
                      if d not in ne.coords or d not in te.coords: raise ValueError(f'MISSING_COORD:{d}')
                      a=np.asarray(ne.coords[d].load().values); b=np.asarray(te.coords[d].load().values)
                      if a.shape!=b.shape or not np.array_equal(a,b,equal_nan=True): raise ValueError(f'SOURCE_COORDINATE_MISMATCH:{d}')
                      save[f'coord_{d}']=a; coords[d]={'shape':list(a.shape),'dtype':str(a.dtype)}
                  mask=np.isfinite(nv)&np.isfinite(tv)&(nv>0)&(tv>0); idx=np.flatnonzero(mask.reshape(-1))
                  if not len(idx): raise ValueError('NO_FINITE_POSITIVE_PAIRS')
                  npz=OUT/'data'/f'SHOT_{sid}_THOMSON_P058.npz'; np.savez_compressed(npz,**save)
                  fn=nv.reshape(-1); ft=tv.reshape(-1)
                  frames.append(pd.DataFrame({'shot_id':sid,'selection_role':role,'n_e':fn[idx],'t_e':ft[idx]}))
                  success.append(sid)
                  if role=='RESERVE': reserve_used.append(sid)
                  rec.update({'state':'PAIRED_EXACT','shape':list(nv.shape),'dims':nd,'coordinates':coords,'raw_pairs':int(nv.size),
                              'finite_positive_pairs':int(len(idx)),'npz':str(npz.relative_to(OUT)),'npz_sha256':hashlib.sha256(npz.read_bytes()).hexdigest(),
                              'n_e_attrs':{str(k):str(v) for k,v in ne.attrs.items()},'t_e_attrs':{str(k):str(v) for k,v in te.attrs.items()}})
              except Exception as e:
                  rec.update({'state':'FAILED','error_type':type(e).__name__,'error':str(e),'traceback':traceback.format_exc()})
                  if role=='PRIMARY': primary_fail.append(sid)
              receipts.append(rec)
              (OUT/'receipts'/f'SHOT_{sid}_RECEIPT_P058.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          if len(success)<TARGET: raise SystemExit(f'N100_UNDERCOVERED:{len(success)}')

          test=pd.concat(frames,ignore_index=True); x=np.log(test.n_e.to_numpy(float)); y=np.log(test.t_e.to_numpy(float))
          pred={'CT_FIXED_1_3':FIT['a_ct']+FIT['ct_b']*x,'FREE_POWER_LAW':FIT['a_free']+FIT['b_free']*x,'NULL_LOG_MEAN':np.full_like(y,FIT['a_null'])}
          sq={k:(y-v)**2 for k,v in pred.items()}; err={k:float(v.mean()) for k,v in sq.items()}
          best=min(('FREE_POWER_LAW','NULL_LOG_MEAN'),key=lambda k:err[k]); delta=float(err[best]-err['CT_FIXED_1_3'])
          per={}; sb={k:[] for k in sq}; sums={k:[] for k in sq}; counts=[]
          for sid,g in test.groupby('shot_id',sort=False):
              ii=g.index.to_numpy(); counts.append(len(ii)); e={k:float(sq[k][ii].mean()) for k in sq}
              for k in sq: sb[k].append(e[k]); sums[k].append(float(sq[k][ii].sum()))
              per[str(int(sid))]={'pairs':int(len(ii)),'E_CT':e['CT_FIXED_1_3'],'E_FREE':e['FREE_POWER_LAW'],'E_NULL':e['NULL_LOG_MEAN'],
                                  'delta_best_minus_ct':float(min(e['FREE_POWER_LAW'],e['NULL_LOG_MEAN'])-e['CT_FIXED_1_3'])}
          sbe={k:float(np.mean(v)) for k,v in sb.items()}; delta_sb=float(min(sbe['FREE_POWER_LAW'],sbe['NULL_LOG_MEAN'])-sbe['CT_FIXED_1_3'])
          ds=np.array([v['delta_best_minus_ct'] for v in per.values()]); neg=int((ds<0).sum()); pos=int((ds>0).sum()); zero=int((ds==0).sum())
          rng=np.random.default_rng(BOOT_SEED); n=len(counts); counts=np.array(counts,float); sums={k:np.array(v,float) for k,v in sums.items()}; sb={k:np.array(v,float) for k,v in sb.items()}
          bp=np.empty(BOOT); bs=np.empty(BOOT)
          for i in range(BOOT):
              ix=rng.integers(0,n,n); den=counts[ix].sum(); be={k:sums[k][ix].sum()/den for k in sq}
              bp[i]=min(be['FREE_POWER_LAW'],be['NULL_LOG_MEAN'])-be['CT_FIXED_1_3']; bse={k:sb[k][ix].mean() for k in sq}
              bs[i]=min(bse['FREE_POWER_LAW'],bse['NULL_LOG_MEAN'])-bse['CT_FIXED_1_3']
          ci_p=[float(np.quantile(bp,.025)),float(np.quantile(bp,.975))]; ci_s=[float(np.quantile(bs,.025)),float(np.quantile(bs,.975))]
          sign_p=float(sum(math.comb(n,k) for k in range(min(neg,pos)+1))/(2**n)) if zero==0 else None
          result={'pass':'P058','object':'FAIR_MAST_CORRECTED_PROVIDER_N100_CONFIRMATION','authority':'SCORE_ONLY','effective_pairable_shots':success,
                  'effective_pairable_count':len(success),'primary_failures':primary_fail,'primary_failure_count':len(primary_fail),'reserve_used':reserve_used,
                  'reserve_used_count':len(reserve_used),'test_rows':int(len(test)),'fit_sha256':FIT_SHA,'selection_sha256':SEL_SHA,'test_refit':False,
                  'ct_b':FIT['ct_b'],'free_b_frozen':FIT['b_free'],'test_mse_log_te':err,'test_shot_balanced_mse_log_te':sbe,'best_frozen_comparator':best,
                  'Delta_1_N100_best_minus_ct':delta,'Delta_1_N100_shot_balanced_best_minus_ct':delta_sb,'positive_favors_CT':True,'per_shot_diagnostics':per,
                  'negative_shots':neg,'positive_shots':pos,'zero_shots':zero,'bootstrap':{'resamples':BOOT,'seed':BOOT_SEED,'pair_weighted_delta_ci95':ci_p,
                  'shot_balanced_delta_ci95':ci_s,'pair_weighted_fraction_positive':float((bp>0).mean()),'shot_balanced_fraction_positive':float((bs>0).mean())},
                  'sign_test_one_sided_extreme_direction_p':sign_p,'provider':'FAIR_MAST_LEVEL2','strict_tokamark_equivalence_proved':False,'scientific_promotion':False}
          (OUT/'P058_N100_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (OUT/'P058_N100_RECEIPTS.json').write_text(json.dumps(receipts,indent=2,sort_keys=True)+'\n')
          summary={'effective_pairable':100,'primary_failed':len(primary_fail),'reserve_used':len(reserve_used),'rows':len(test),'best':best,'delta_pair':delta,
                   'delta_shot_balanced':delta_sb,'negative_shots':neg,'positive_shots':pos,'ci95_pair':ci_p,'ci95_shot_balanced':ci_s}
          (OUT/'P058_N100_SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n'); print(json.dumps(summary,indent=2))
          PY
      - name: Hash payload
        if: always()
        run: |
          if [ -d p058-score-only ]; then find p058-score-only -type f ! -name SHA256SUMS_P058.txt -print0 | sort -z | xargs -0 sha256sum > p058-score-only/SHA256SUMS_P058.txt; fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p058-score-only
          path: p058-score-only
          if-no-files-found: error
          retention-days: 1
